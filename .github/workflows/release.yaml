# Runs when a version tag is pushed (make git-tag-release). It builds and pushes
# the image, deploys it to Railway, then publishes a GitHub release.
#
# Repo secrets:
#   DOCKER_HUB_USERNAME, DOCKER_HUB_ACCESS_TOKEN   push the image to Docker Hub
#   plus the Railway secrets listed in deploy-railway.yaml

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        run: make release-image VERSION="${VERSION}"
        env:
          VERSION: ${{ github.ref_name }}

  deploy:
    name: Deploy
    needs: image
    uses: ./.github/workflows/deploy-railway.yaml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}

  github-release:
    name: Publish GitHub release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        run: gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --title "${VERSION}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
